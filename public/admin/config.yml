backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. Toys 設定
  - name: "toys"
    label: "🧸 Toys"
    folder: "src/content/toys"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Image", name: "image", widget: "image"}
      - {label: "Description", name: "body", widget: "markdown"}

  # 2. Papers 設定
  - name: "papers"
    label: "📄 Papers"
    folder: "src/content/papers"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Venue/Conference", name: "venue", widget: "string"}
      - {label: "Authors", name: "authors", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Last Updated", name: "lastmod", widget: "datetime", required: false}
      - {label: "Link (DOI/PDF)", name: "link", widget: "string", required: false}
      - {label: "Type", name: "type", widget: "select", options: ["Conference", "Journal", "Patent"]}
      - {label: "Abstract", name: "body", widget: "markdown"}